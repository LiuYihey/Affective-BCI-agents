name: Add a reference
description: Suggest a paper that is missing from the resource index
labels: ["reference"]
body:
  - type: input
    id: title
    attributes:
      label: Title
      placeholder: The title of the paper
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: DOI or arXiv link
      placeholder: https://doi.org/10.1109/...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Which research area does this paper belong to?
      options:
        - Signal Acquisition & Quality
        - Affective Targets & Corpora
        - Decoding Architectures
        - Generalization & Transfer
        - Evaluation & Leakage Control
        - Evidence Maturity
        - Closed-Loop Systems
        - Application Domains
        - Governance & Ethics
    validations:
      required: true
  - type: textarea
    id: note
    attributes:
      label: Why is it worth opening?
      description: One sentence on what the paper settles, or where it falls short.
      placeholder: Shows how much a favourable split can inflate accuracy.
    validations:
      required: true
  - type: input
    id: code
    attributes:
      label: Code repository (optional)
      placeholder: https://github.com/...
  - type: input
    id: year
    attributes:
      label: Year (optional)
      placeholder: "2026"
